<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Машинка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Пейзаж (небо, трава и дорога) средствами CSS */
    body {
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: linear-gradient(
        to bottom,
        #87ceeb 0%,
        #e0f6ff 70%,
        #4caf50 70%,
        #4caf50 78%,
        #333333 78%,
        #333333 100%
      );
    }

    /* Солнце */
    body::before {
      content: "";
      position: absolute;
      top: 40px;
      right: 80px;
      width: 70px;
      height: 70px;
      background: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 30px #ffd166;
    }

    /* Дорожная разметка */
    body::after {
      content: "";
      position: absolute;
      bottom: 9%;
      left: 0;
      width: 100%;
      height: 6px;
      background: repeating-linear-gradient(
        to right,
        #ffffff 0 40px,
        transparent 40px 80px
      );
    }

    /* Кузов машинки (ширина строго 200px) */
    .car {
      position: absolute;
      bottom: 13%;
      left: 0;
      width: 200px;
      height: 55px;
      background: linear-gradient(180deg, #ef233c 0%, #d90429 100%);
      border-radius: 15px 35px 8px 8px;
      box-shadow:
        inset -8px 8px 0 #fff3b0,
        inset 6px 8px 0 #ff758f;
      animation: drive 3s ease-out forwards;
    }

    /* Кабина и окна */
    .car::before {
      content: "";
      position: absolute;
      top: -36px;
      left: 32px;
      width: 115px;
      height: 38px;
      border: 5px solid #ef233c;
      border-bottom: none;
      border-radius: 25px 38px 0 0;
      background: linear-gradient(
        90deg,
        #a8dadc 0% 46%,
        #ef233c 46% 54%,
        #a8dadc 54% 100%
      );
    }

    /* Два колеса с дисками */
    .car::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 35px;
      width: 24px;
      height: 24px;
      background: #d9d9d9;
      border-radius: 50%;
      box-shadow:
        0 0 0 10px #1d1e22,
        106px 0 0 0 #d9d9d9,
        106px 0 0 10px #1d1e22;
    }

    /* Анимация движения */
    @keyframes drive {
      0% {
        transform: translateX(-200px);
      }
      100% {
        transform: translateX(calc(100vw - 250px));
      }
    }
  </style>
</head>
<body>
  <div class="car"></div>
</body>
</html>
